[package]
name = "gnss-protos"
version = "0.2.0"
license = "MPL-2.0"
authors = ["Guillaume W. Bres <guillaume.bressaix@gmail.com>"]
description = "GNSS protos encoder and decoder"
homepage = "https://github.com/nav-solutions"
repository = "https://github.com/nav-solutions/gnss-protos"
keywords = ["geo", "gps", "galileo"]
categories = ["science", "science::geo", "parsing"]
edition = "2021"
rust-version = "1.64"

exclude = [
    "data/*",
]

[package.metadata]
msrv = "1.89"

[features]
default = ["gps", "galileo"]

# Unlock GPS (+QZSS) protocol
gps = []

std = []

# Unlock Galileo (I/NAV) protocol
galileo = []

# Unlock all protocols at once
all = ["gps", "galileo"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docrs", "--generate-link-to-definition"]

[dependencies]
thiserror = "1"
bitbuffer = "0.11"
hifitime = "4"
log = { version = "0.4", optional = true }
num-traits = { version = "0.2", default-features = false }

[dev-dependencies]
log = "0.4"
env_logger = "0.11"
clap = { version = "4.3.24", features = ["derive"] }
